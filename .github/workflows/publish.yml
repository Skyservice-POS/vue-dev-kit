name: Publish to npm

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    # Для створення тега й релізу. За замовчуванням GITHUB_TOKEN може бути
    # read-only — тоді gh release create падає з 403.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Нотатки релізу читають історію від попереднього тега — за дефолтним
          # shallow-клоном (depth 1) git describe і git log range не працюють.
          fetch-depth: 0

      # Без cache: npm — lock-файл навмисно в .gitignore, а кеш setup-node
      # без нього падає ("Dependencies lock file is not found").
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # У main прилітають і коміти без релізу — доки, рефакторинг, правки CI.
      # Без цієї перевірки npm publish падав би з EPUBLISHCONFLICT на кожному
      # такому пуші й фарбував історію Actions у червоне.
      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Пакет: $NAME@$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "Версія вже в реєстрі — публікацію пропускаємо."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Версії в реєстрі немає — публікуємо."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      # npm install, а не npm ci — останній вимагає lock-файл у репозиторії.
      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: npm install

      # Збірку робить сам npm через prepublishOnly.
      # Авторизація — через .npmrc у репо, який читає NPM_TOKEN з оточення.
      - name: Publish
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Тег і реліз ставимо після публікації, а не до неї — щоб у GitHub не
      # з'являлись теги на версії, які до реєстру так і не доїхали.
      - name: Create GitHub release
        if: steps.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          .github/scripts/release-notes.sh "$VERSION" > notes.md
          cat notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md

      - name: Skipped
        if: steps.check.outputs.should_publish != 'true'
        run: echo "Версію не змінювали — нічого публікувати."
