server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Хешовані ассети VitePress — імена унікальні, тож кешуємо назавжди.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # У config.mts увімкнено cleanUrls, тож /components/modal має віддавати
    # modal.html. Без $uri.html такі посилання ловили б 404 при прямому заході.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
